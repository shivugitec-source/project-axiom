services:
  postgres:
    image: postgres:17-alpine
    container_name: axiom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: axiom
      POSTGRES_USER: axiom_admin
      POSTGRES_PASSWORD: axiom_admin_dev_only
    ports:
      - "${AXIOM_DB_PORT:-5432}:5432"
    volumes:
      - axiom-postgres-data:/var/lib/postgresql/data
      - ./init/01-create-app-user.sql:/docker-entrypoint-initdb.d/01-create-app-user.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  axiom-postgres-data:
