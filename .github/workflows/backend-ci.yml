name: Backend CI

on:
  push:
    branches: [main, "development/**", "fix/**", "feature/**", "engineering/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: axiom
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d axiom"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Verify modular-monolith dependency boundaries
        run: python3 backend/verify-module-dependencies.py
      - name: Test modular-monolith dependency verifier
        run: python3 -m unittest discover -s backend/tests -p 'test_*.py' -v
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Provision separate migration and runtime database roles
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -U postgres -d axiom -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE axiom_migrator LOGIN PASSWORD 'axiom_ci_migration_password'
              NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
          CREATE ROLE axiom_app LOGIN PASSWORD 'axiom_ci_password'
              NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;
          GRANT CONNECT ON DATABASE axiom TO axiom_migrator, axiom_app;
          CREATE SCHEMA axiom AUTHORIZATION axiom_migrator;
          GRANT USAGE ON SCHEMA axiom TO axiom_app;
          ALTER DEFAULT PRIVILEGES FOR ROLE axiom_migrator IN SCHEMA axiom
              GRANT SELECT ON TABLES TO axiom_app;
          SQL
      - name: Build the isolated migration artifact
        run: mvn -B -ntp -DskipTests clean package -f backend/axiom-parent/pom.xml
      - name: Verify packaged API and migrator boundaries
        run: |
          python3 backend/verify-migration-artifacts.py \
            backend/axiom-parent/axiom-bootstrap/target/axiom-bootstrap-0.1.0-SNAPSHOT.jar \
            backend/axiom-parent/axiom-migrator/target/axiom-migrator-0.1.0-SNAPSHOT.jar
      - name: Run Flyway in a dedicated migration process
        env:
          AXIOM_MIGRATION_DB_URL: jdbc:postgresql://localhost:5432/axiom
          AXIOM_MIGRATION_DB_USERNAME: axiom_migrator
          AXIOM_MIGRATION_DB_PASSWORD: axiom_ci_migration_password
        run: java -jar backend/axiom-parent/axiom-migrator/target/axiom-migrator-0.1.0-SNAPSHOT.jar
      - name: Verify migration job is idempotent
        env:
          AXIOM_MIGRATION_DB_URL: jdbc:postgresql://localhost:5432/axiom
          AXIOM_MIGRATION_DB_USERNAME: axiom_migrator
          AXIOM_MIGRATION_DB_PASSWORD: axiom_ci_migration_password
        run: java -jar backend/axiom-parent/axiom-migrator/target/axiom-migrator-0.1.0-SNAPSHOT.jar
      - name: Verify backend with runtime credentials only
        env:
          AXIOM_DB_URL: jdbc:postgresql://localhost:5432/axiom
          AXIOM_DB_USERNAME: axiom_app
          AXIOM_DB_PASSWORD: axiom_ci_password
        run: mvn -B -ntp verify -f backend/axiom-parent/pom.xml
