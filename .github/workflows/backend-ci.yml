name: Backend CI

on:
  push:
    branches: [main, "development/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: axiom
          POSTGRES_USER: axiom
          POSTGRES_PASSWORD: axiom_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axiom -d axiom"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      AXIOM_DB_URL: jdbc:postgresql://localhost:5432/axiom
      AXIOM_DB_USERNAME: axiom
      AXIOM_DB_PASSWORD: axiom_ci_password
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify backend
        run: mvn -B -ntp clean verify -f backend/axiom-parent/pom.xml
