name: Backend CI

on:
  push:
    branches: [main, "development/**", "fix/**", "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: axiom
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d axiom"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      AXIOM_DB_URL: jdbc:postgresql://localhost:5432/axiom
      AXIOM_DB_USERNAME: axiom_app
      AXIOM_DB_PASSWORD: axiom_ci_password
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Provision restricted application database role
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER_ID" psql -U postgres -d axiom -v ON_ERROR_STOP=1 -c "CREATE ROLE axiom_app LOGIN PASSWORD 'axiom_ci_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT"
          docker exec "$POSTGRES_CONTAINER_ID" psql -U postgres -d axiom -v ON_ERROR_STOP=1 -c "GRANT CONNECT, CREATE ON DATABASE axiom TO axiom_app"
      - name: Verify backend
        run: mvn -B -ntp clean verify -f backend/axiom-parent/pom.xml
